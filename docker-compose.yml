version: '3.8'

services:
  db:
    container_name: restaurante_db
    build:
      context: ./Proyecto_Web_Restaurante
      dockerfile: Dockerfile.db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  web:
    container_name: restaurante_web
    build:
      context: ./Proyecto_Web_Restaurante
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=RestauranteBD;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      - db

volumes:
  sqlserver_data:
