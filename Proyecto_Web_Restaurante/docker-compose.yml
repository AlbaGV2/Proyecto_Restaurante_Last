version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurante_web
    restart: always
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__DefaultConnection=Server=db,1433;Database=RestauranteBD;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;"
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: restaurante_db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./sql:/docker-entrypoint-initdb.d # Note: SQL Server doesn't support this out of the box like Postgres, but we can use a custom entrypoint if needed. For now, we'll keep it simple.

volumes:
  sql_data:
